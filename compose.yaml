name: counter-history
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_DB: counter_history
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${APP_DATA_ROOT:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter_history"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
